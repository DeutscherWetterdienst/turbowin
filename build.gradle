plugins {
    id 'java'
    id 'application'
    id 'org.beryx.jlink' version '4.2.0'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.diffplug.spotless' version '8.11.0'
}

javafx {
    version = '25.0.5.1'
    modules = ['javafx.controls', 'javafx.swing']
}

group = 'turbowin'
version = '6.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fazecast:jSerialComm:2.11.4'
    implementation 'org.eclipse.angus:smtp:2.0.5'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-swing-junit:3.17.1'
}

sourceSets {
    main {
        java {
            srcDirs += "$buildDir/generated/source/appinfo/java"
            srcDirs += "$buildDir/generated/source/emailsettings/java"
            srcDir 'contrib/format101/java/src/main/java'
            exclude 'format101/CliMain.java'
        }
    }
}

tasks.named('processResources') {
    from('contrib/format101/reference/config') {
        include 'S-AWS-101_modl_pilote.csv'
        into 'format101/config'
    }
}

jar {
    // Offline map resources are installed as files in the runtime image.
    exclude 'turbowin/OSM/**'
    manifest {
        attributes(
            'Main-Class': 'turbowin.main'
        )
    }
}

application {
    mainModule.set('turbowin')
    mainClass.set('turbowin.main')
}

jlink {
    launcher {
        name = 'turbowin'
    }
    options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages']
}

// A release is a clean checkout at a tag matching the package version. CI tag variables also
// work with shallow checkouts; archive builds without Git are explicitly unidentified dev builds.
def gitOutput = { List<String> args ->
    try {
        def process = new ProcessBuilder(['git'] + args)
            .directory(project.projectDir).redirectErrorStream(true).start()
        def output = process.inputStream.getText('UTF-8').trim()
        return process.waitFor() == 0 ? output : null
    } catch (IOException ignored) {
        return null
    }
}
def checkoutCommit = gitOutput(['rev-parse', 'HEAD'])
def ciCommit = [System.getenv('GITHUB_SHA'), System.getenv('CI_COMMIT_SHA')]
    .find { it?.trim() }?.trim()
def fullCommit = checkoutCommit ?: ciCommit
fullCommit = fullCommit ==~ /(?i)[0-9a-f]{40,64}/ ? fullCommit.toLowerCase() : 'unknown'
def shortCommit = fullCommit == 'unknown' ? 'unknown' : fullCommit.take(7)
def gitStatus = checkoutCommit ? gitOutput(['status', '--porcelain', '--untracked-files=normal']) : null
def dirty = gitStatus != null && !gitStatus.isEmpty()
def expectedTags = ["v${project.version}".toString(), project.version.toString()]
def ciTag = System.getenv('CI_COMMIT_TAG')
if (!ciTag && System.getenv('GITHUB_REF_TYPE') == 'tag') {
    ciTag = System.getenv('GITHUB_REF_NAME')
}
def matchingCheckout = !checkoutCommit || !ciCommit || checkoutCommit.equalsIgnoreCase(ciCommit)
def tags = checkoutCommit ? gitOutput(['tag', '--points-at', 'HEAD']) : null
def matchingTag = (tags?.readLines()?.any { expectedTags.contains(it) } ?: false) ||
    (matchingCheckout && expectedTags.contains(ciTag))
def ciArchive = !checkoutCommit && fullCommit != 'unknown' &&
    (System.getenv('GITHUB_ACTIONS') == 'true' || System.getenv('GITLAB_CI') == 'true')
def releaseBuild = matchingTag && ((gitStatus != null && !dirty) || ciArchive)
def buildLabel = releaseBuild ? project.version.toString() :
    "${project.version}-dev+${shortCommit}${dirty ? '.dirty' : ''}".toString()
def artifactSuffix = releaseBuild ? 'release' : "dev-${shortCommit}${dirty ? '-dirty' : ''}".toString()

tasks.register('printBuildArtifactSuffix') {
    doLast { println artifactSuffix }
}

task generateAppInfoJava {
    inputs.property('gitCommit', fullCommit)
    inputs.property('buildLabel', buildLabel)

    doLast {
        def generatedSourceDir = file("$buildDir/generated/source/appinfo/java")
        generatedSourceDir.mkdirs()

        def javaFile = new File(generatedSourceDir, "TurboWinAppInfo.java")
        javaFile.text = """\
            package turbowin;
            // DO NOT EDIT - This file is generated by build.gradle
            public class TurboWinAppInfo {
                public static final String GIT_COMMIT = "${fullCommit}";
                public static final String SHORT_GIT_COMMIT = "${shortCommit}";
                public static final String RELEASE_VERSION = "${project.version}";
                public static final String BUILD_VERSION = "${buildLabel}";
                public static final String APPLICATION_VERSION = "${buildLabel} [${System.getProperty("sun.arch.data.model")}-bit] (build ${new Date().format('d-MMMM-yyyy')}, commit ${shortCommit})";  // is tested for substring "[64-bit]"
            }
        """
    }
}

task generateEmailSettingsJava {
    inputs.property("encryptionKey", System.getenv('TURBOWIN_EMAIL_ENCRYPTION_KEY') ?: "")
    inputs.property("characterEncoding", System.getenv('TURBOWIN_EMAIL_CHARACTER_ENCODING') ?: "")
    inputs.property("cipherTransformation", System.getenv('TURBOWIN_EMAIL_CIPHER_TRANSFORMATION') ?: "")
    inputs.property("aesEncryptionAlgorithm", System.getenv('TURBOWIN_EMAIL_AES_ENCRYPTION_ALGORITHM') ?: "")

    def generatedSourceDir = file("$buildDir/generated/source/emailsettings/java")
    outputs.dir(generatedSourceDir)

    doLast {
        def encryptionKey = inputs.properties.encryptionKey
        def characterEncoding = inputs.properties.characterEncoding
        def cipherTransformation = inputs.properties.cipherTransformation
        def aesEncryptionAlgorithm = inputs.properties.aesEncryptionAlgorithm

        if (!encryptionKey?.trim() ||
                !characterEncoding?.trim() ||
                !cipherTransformation?.trim() ||
                !aesEncryptionAlgorithm?.trim()) {
            throw new GradleException("One or more TURBOWIN_EMAIL_* environment variables are not set or are empty.")
        }

        generatedSourceDir.mkdirs()

        def javaFile = new File(generatedSourceDir, "EmailSettingsConstants.java")

        javaFile.getParentFile().mkdirs()

        javaFile.text = """\
            package turbowin;
            // DO NOT EDIT - This file is generated by build.gradle
            public class EmailSettingsConstants {
                public static final String encryptionKey = "${encryptionKey}";
                public static final String characterEncoding = "${characterEncoding}";
                public static final String cipherTransformation = "${cipherTransformation}";
                public static final String aesEncryptionAlgorithm = "${aesEncryptionAlgorithm}";
            }
        """
    }
}

compileJava.dependsOn generateAppInfoJava, generateEmailSettingsJava

processResources.dependsOn generateAppInfoJava, generateEmailSettingsJava

tasks.jlink.doLast {
    copy {
        from('src/main/resources/turbowin/help_files')
        into file("$buildDir/image/help")
    }
    copy {
        from('src/main/resources/turbowin/OSM')
        into file("$buildDir/image/OSM")
    }
}

task printVersion {
    doLast {
        println project.version
    }
}

test {
    jvmArgs '--add-opens', 'java.base/java.util=ALL-UNNAMED'
}

check.dependsOn spotlessCheck

spotless {
    java {
        target('src/**/*.java')

        googleJavaFormat()

        importOrder()
        removeUnusedImports()

        trimTrailingWhitespace()
        endWithNewline()
    }
}
