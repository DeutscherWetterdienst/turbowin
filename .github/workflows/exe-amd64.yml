name: exe-amd64

on:
  push:
  pull_request:

jobs:
  exe-amd64:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build EXE package
        run: powershell -File scripts/task_windows.ps1
        env:
          TURBOWIN_EMAIL_ENCRYPTION_KEY: ${{ secrets.TURBOWIN_EMAIL_ENCRYPTION_KEY }}
          TURBOWIN_EMAIL_CHARACTER_ENCODING: ${{ secrets.TURBOWIN_EMAIL_CHARACTER_ENCODING }}
          TURBOWIN_EMAIL_CIPHER_TRANSFORMATION: ${{ secrets.TURBOWIN_EMAIL_CIPHER_TRANSFORMATION }}
          TURBOWIN_EMAIL_AES_ENCRYPTION_ALGORITHM: ${{ secrets.TURBOWIN_EMAIL_AES_ENCRYPTION_ALGORITHM }}
      - name: Test EXE installer lifecycle
        run: |
          $package = Get-ChildItem build/jpackage -Filter '*.exe' | Select-Object -First 1
          if (-not $package) { throw 'No EXE installer was generated.' }
          powershell -File scripts/package_smoke_test_exe.ps1 -Artifact $package.FullName
      - name: Upload EXE installer
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: exe-amd64-artifacts
          path: build/jpackage/*
          retention-days: 7
      - name: Upload EXE smoke-test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: exe-amd64-smoke-diagnostics
          path: build/package-smoke
          if-no-files-found: warn
          retention-days: 7
