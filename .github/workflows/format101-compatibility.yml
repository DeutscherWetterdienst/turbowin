name: format101-compatibility

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Python encoder against checked-in vectors
        working-directory: contrib/format101
        env:
          PYTHONPATH: python/src
        run: python3 tests/harness/verify_python_encoder_against_vectors.py
      - name: Verify Java encoder against checked-in vectors
        working-directory: contrib/format101
        run: python3 tests/harness/verify_java_encoder_against_vectors.py --build
      - name: Verify group combinations
        working-directory: contrib/format101
        env:
          PYTHONPATH: python/src
        run: |
          python3 tests/harness/verify_python_encoder_against_vectors.py --dir tests/vectors/groups
          python3 tests/harness/verify_java_encoder_against_vectors.py --dir tests/vectors/groups
      - name: Validate supported input structure
        working-directory: contrib/format101
        run: |
          python3 tests/harness/validate_supported_vectors.py \
            --dir tests/vectors/application \
            --dir tests/vectors/boundaries \
            --dir tests/vectors/groups \
            --dir tests/vectors/generated_combo \
            --dir tests/vectors/fuzz_1234

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Python encoder against checked-in vectors
        working-directory: contrib/format101
        env:
          PYTHONPATH: ${{ github.workspace }}\contrib\format101\python\src
        run: python tests/harness/verify_python_encoder_against_vectors.py
      - name: Verify Java encoder against checked-in vectors
        working-directory: contrib/format101
        run: python tests/harness/verify_java_encoder_against_vectors.py --build
      - name: Verify group combinations
        working-directory: contrib/format101
        env:
          PYTHONPATH: ${{ github.workspace }}\contrib\format101\python\src
        run: |
          python tests/harness/verify_python_encoder_against_vectors.py --dir tests/vectors/groups
          python tests/harness/verify_java_encoder_against_vectors.py --dir tests/vectors/groups
      - name: Verify native reference against checked-in vectors
        working-directory: contrib/format101
        run: |
          python tests/harness/verify_reference_vectors_windows.py
          python tests/harness/verify_reference_vectors_windows.py --dir tests/vectors/application
          python tests/harness/verify_reference_vectors_windows.py --dir tests/vectors/boundaries
          python tests/harness/verify_reference_vectors_windows.py --dir tests/vectors/groups
          python tests/harness/verify_reference_vectors_windows.py --dir tests/vectors/generated_combo
          python tests/harness/verify_reference_vectors_windows.py --dir tests/vectors/fuzz_1234
